[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krm"
version = "0.2.0"
description = "Competency Role Model pipeline for STEM labor market analysis"
license = "MIT"
readme = "docs/README.md"
requires-python = ">=3.11"

dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "sentence-transformers>=4.0",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "scikit-learn>=1.4",
    "transformers>=4.44",
    "torch>=2.0",
    "plotly>=5.22",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "httpx>=0.27",
]

[project.optional-dependencies]
analysis = [
    "statsmodels>=0.14",
    "ruptures>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "doit>=0.36",
]

[project.scripts]
krm = "krm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/krm"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: full pipeline smoke test",
    "integration: tests that require real I/O between phases",
]
filterwarnings = ["ignore::DeprecationWarning:torch.*"]
