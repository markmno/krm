# ---------------------------------------------------------------------------
# Phase 2: STEM/IT Classification
# ---------------------------------------------------------------------------
classification:
  model: facebook/bart-large-mnli
  device: cuda             # "cpu" | "cuda" | "mps"
  batch_size: 32
  stem_threshold: 0.6
  it_threshold: 0.6
  interdisciplinary_threshold: 0.5
  stem_hypothesis: "This job is a scientific research position at a laboratory or academic institution"
  it_hypothesis: "This job is a software engineering or information technology development role"
  admin_hypothesis: "This job is an administrative, managerial, or non-research academic role"

# ---------------------------------------------------------------------------
# Phase 3: Role Discovery (Job Title Clustering)
# ---------------------------------------------------------------------------
roles:
  embedding_model: deepvk/USER-bge-m3
  embedding_dim: 1024
  umap_n_components: 16
  umap_metric: cosine
  umap_min_dist: 0.0
  umap_n_neighbors: 30
  hdbscan_min_cluster_size: 10
  hdbscan_min_samples: 5
  hdbscan_cluster_selection_epsilon: 0.25
  hdbscan_metric: euclidean
  min_vacancies_per_cluster: 10

# ---------------------------------------------------------------------------
# Phase 2b / Phase 4: Skill Extraction (data-driven, no ESCO)
# ---------------------------------------------------------------------------
skills:
  tfidf_max_features: 5000
  min_skill_frequency: 3

# ESCO is deprecated — skills are now extracted from vacancy descriptions
# using Russian NLP (pymorphy3 + natasha) and embedding deduplication.
# See: src/krm/phase_2b_extract_skills.py (Phase 2b)
#       src/krm/phase_4_skills.py (Phase 4, rewritten)

skill_extraction:
  min_phrase_length: 2
  max_phrase_length: 4
  similarity_threshold: 0.85   # cosine similarity for embedding deduplication
  min_doc_frequency: 5          # minimum vacancies mentioning a skill to keep it
  max_skills_per_vacancy: 30
  embedding_model: deepvk/USER-bge-m3  # symmetric, Russian-tuned, no prefix needed

# LLM-backed extraction backend (OpenAI-compatible HTTP endpoint).
# llama-server (llama.cpp) exposes /v1/chat/completions by default.
llm:
  base_url: "http://localhost:8080/v1"   # llama-server default (llama.cpp)
  model: "Qwen/Qwen3.8-27B"
  concurrency: 4
  temperature: 0.0
  max_tokens: 2048
  enabled: true                          # master switch for the LLM backend
  max_retries: 2                         # instructor create() retries on validation failure
  response_format: "json_schema"         # structured-output mode (instructor Mode.JSON_SCHEMA)
  cache_dir: "data/llm_cache"            # on-disk response cache for reproducibility
  # Per-phase opt-in. Flip a phase's `use_llm` to `true` to route it through
  # the LLM backend instead of its deterministic default.
  phases:
    phase_2b_skills:
      use_llm: true      # already LLM-based (skill extraction)
    phase_2_5_chars:
      use_llm: true      # LLM scores 7 characteristics in one call
    phase_5_skill_axis:
      use_llm: true      # LLM tags out-of-glossary skills
    phase_5b_soft:
      use_llm: true      # LLM scores soft competences (rubric fallback)
    phase_3_naming:
      use_llm: true      # LLM role names (top-3 titles fallback)

# Proficiency scale (1-5)
proficiency:
  min: 1.0
  max: 5.0
  labels:
    1: "Начальный"
    2: "Базовый"
    3: "Средний"
    4: "Продвинутый"
    5: "Экспертный"

# Competency role model levels (bachelor → senior researcher)
role_levels:
  - id: 0
    label: "Бакалавр"
    weight: 0.10
  - id: 1
    label: "Магистр"
    weight: 0.25
  - id: 2
    label: "Аспирант / МНС"
    weight: 0.40
  - id: 3
    label: "Научный сотрудник"
    weight: 0.60
  - id: 4
    label: "Старший научный сотрудник"
    weight: 0.80
  - id: 5
    label: "Ведущий научный сотрудник"
    weight: 0.95
  - id: 6
    label: "Главный научный сотрудник"
    weight: 1.00

# ---------------------------------------------------------------------------
# Phase 2.5 & Phase 5: Unified Characteristics (Zero-Shot NLI)
# ---------------------------------------------------------------------------
# Seven competency characteristics for both vacancy-level extraction (Phase 2.5)
# and skill-to-characteristic mapping (Phase 5).  Each hypothesis is tagged with
# D&D-style skill categories that link it to related ESCO skill clusters.
characteristics:
