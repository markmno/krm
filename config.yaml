# ============================================================================
# KRM Pipeline Configuration
# ============================================================================
# Single source of truth for all pipeline parameters.
# Each phase reads its section via src/krm/config.py.

pipeline:
  raw_dir: data/raw
  output_dir: data
  models_dir: models
  reports_dir: reports

paths:
  characteristics: data/characteristics.parquet
  characteristic_scores: data/characteristic_scores.parquet

# ---------------------------------------------------------------------------
# Phase 0: Historical Data Collection (Wayback Machine + Open Data APIs)
# ---------------------------------------------------------------------------
phase0:
  output_dir: data/phase0
  db_path: data/phase0/historical.duckdb
  census_cache_dir: data/phase0/census

  cdx:
    rate_limit_rps: 1
    max_per_query: 150000
    endpoint: "https://web.archive.org/cdx/search/cdx"

  hhru_wayback:
    enabled: true
    url_patterns:
      legacy: "hh.ru/vacancy*.do"        # 2010-2011
      modern: "hh.ru/vacancy/[0-9]*"      # 2012+
    years: [2017, 2026]
    stem_keywords:
      - физик
      - химик
      - биолог
      - эколог
      - научный сотрудник
      - лаборант
      - материаловед
      - геолог
      - биофизик
      - биохимик
      - биоинформатик
      - генетик
      - микробиолог
      - фармаколог
      - токсиколог
      - океанолог
      - метеоролог

  linkedin_wayback:
    enabled: true
    url_patterns:
      legacy: "linkedin.com/jobs2/view/*"     # 2013-2016
      modern: "linkedin.com/jobs/view/*"       # 2019+
    languages: ["en"]
    stem_keywords:
      - scientist
      - researcher
      - chemist
      - biologist
      - physicist
      - bioinformatician
      - computational
      - laboratory
      - lab technician
      - pharmacologist
      - geneticist
      - microbiologist
      - materials scientist
      - geologist
      - environmental scientist
      - data scientist

  trudvsem:
    enabled: true
    base_url: "https://opendata.trudvsem.ru/api/v1"
    date_from: "2017-01-01"
    date_to: "2025-12-31"
    rate_limit_rps: 1

  rostud:
    enabled: false
    dataset_path: data/phase0/rostud_raw

  telegram:
    enabled: false
    api_id: 0
    api_hash: ""
    session_name: "krm"
    channels: []
    keywords: []
    limit_per_channel: 200

# ---------------------------------------------------------------------------
# Phase 1: Vacancy Collection (HH.ru API)
# ---------------------------------------------------------------------------
collection:
  date_from: "2010-01-01"
  keywords:
    - физик
    - химик
    - биолог
  professional_roles:
    - 79   # Наука, образование / R&D
  categories:
    - 25   # Наука, образование
  exclude_roles:
    - 96   # ИТ, интернет, телеком
    - 123  # Разработка ПО
    - 124  # Системный администратор
    - 125  # Сетевой инженер
    - 126  # Тестировщик
  rate_limit_rps: 2
  max_per_search: 2000   # HH.ru API limit per search query
  http_proxy: ""         # e.g. "http://user:pass@host:port" to bypass hh.ru IP blocks

  # Vacancy-title substrings to drop at collection time (case-insensitive).
  # Removes doctors, ecologists and blue-collar/service staff while keeping
  # research-adjacent roles (лаборант, техник, помощник stay).
  exclude_terms:
    # врачи / медицина
    - врач
    - терапевт
    - хирург
    - стоматолог
    - педиатр
    - невролог
    - кардиолог
    - онколог
    - дерматолог
    - офтальмолог
    - гинеколог
    - уролог
    - психиатр
    - медсестра
    - фельдшер
    - клиник
    - пациент
    - аптек
    - фармацевт
    - провизор
    # экологи
    - эколог
    - окружающей среды
    - природоохран
    - заповедник
    # образование / преподавание
    - учитель
    - преподаватель
    - педагог
    - репетитор
    - воспитатель
    # рабочие / сервис
    - рабочий
    - разнорабочий
    - слесарь
    - монтажник
    - сварщик
    - токарь
    - фрезеровщик
    - электрик
    - сантехник
    - строитель
    - грузчик
    - водитель
    - уборщик
    - кладовщик
    - продавец
    - кассир
    - курьер
    - охранник
    - повар
    - официант

